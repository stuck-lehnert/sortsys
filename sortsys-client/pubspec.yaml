name: sortsys_client
description: Unified sortsys client for web, mobile, tablets and desktop.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sortsys_ui:
    path: ../sortsys-flutter-ui
  provider: 6.1.5+1
  flutter_hooks: 0.21.3+1
  go_router: 18.0.2
  intl: 0.20.3
  http: ^1.6.0
  web: ^1.1.1
  flutter_svg: 2.3.0
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6
  url_launcher: 6.3.3
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/tabler/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/brand/app-icon.png
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
  web:
    generate: true
    image_path: assets/brand/app-icon.png
    background_color: '#FFFFFF'
    theme_color: '#2B74FF'
