name: Job Runner - Run Go tests

on:
  push:
    branches:
      - master
    paths:
      - sortsys-v2-job_runner/**
      - .github/workflows/job-runner-run-tests.yml
  pull_request:
    paths:
      - sortsys-v2-job_runner/**
      - .github/workflows/job-runner-run-tests.yml

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run tests
        working-directory: sortsys-v2-job_runner
        run: go test ./...
