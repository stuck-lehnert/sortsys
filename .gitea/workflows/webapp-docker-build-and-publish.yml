name: Webapp - Build and Push Docker Image

on:
  push:
    branches:
      - deploy
    paths:
      - sortsys-webapp-v2/**
      - sortsys-api-v2/**
      - sortsys-react-components/**
      - sortsys-dwgviewer/**
      - .gitea/workflows/webapp-docker-build-and-publish.yml

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Bun
        run: |
          curl -fsSL https://bun.com/install | bash -s "bun-v1.3.3"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Build local API client package
        working-directory: sortsys-api-v2
        run: npm run client:build

      - name: Install DWG viewer dependencies
        working-directory: sortsys-dwgviewer
        run: npm ci

      - name: Install dependencies
        working-directory: sortsys-webapp-v2
        run: npm ci

      - name: Run `tsc --noEmit`
        working-directory: sortsys-webapp-v2
        run: npx react-router typegen && npx tsc --noEmit

  build:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.result == 'success' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Bun
        run: |
          curl -fsSL https://bun.com/install | bash -s "bun-v1.3.3"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Build local API client package
        working-directory: sortsys-api-v2
        run: npm run client:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea OCI
        uses: docker/login-action@v3
        with:
          registry: gitea.lehnert.cloud
          username: ${{ vars.OCI_USERNAME }}
          password: ${{ secrets.OCI_ACCESS_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sortsys-webapp-v2/Dockerfile
          push: true
          tags: |
            ${{ vars.OCI_WEBAPP_CONTAINER_NAME }}:latest
            ${{ vars.OCI_WEBAPP_CONTAINER_NAME }}:${{ steps.vars.outputs.sha_short }}
