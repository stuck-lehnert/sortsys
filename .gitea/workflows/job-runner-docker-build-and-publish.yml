name: Job Runner - Build and Push Docker Image

on:
  push:
    branches:
      - deploy
    paths:
      - sortsys-v2-job_runner/**
      - .github/workflows/job-runner-docker-build-and-publish.yml

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run tests
        working-directory: sortsys-v2-job_runner
        run: go test ./...

  build:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.result == 'success' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea OCI
        uses: docker/login-action@v3
        with:
          registry: gitea.lehnert.cloud
          username: ${{ vars.OCI_USERNAME }}
          password: ${{ secrets.OCI_ACCESS_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./sortsys-v2-job_runner
          file: ./sortsys-v2-job_runner/Dockerfile
          push: true
          tags: |
            ${{ vars.OCI_JOBRUNNER_CONTAINER_NAME }}:latest
            ${{ vars.OCI_JOBRUNNER_CONTAINER_NAME }}:${{ steps.vars.outputs.sha_short }}
