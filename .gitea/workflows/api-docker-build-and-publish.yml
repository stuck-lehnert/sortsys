name: API - Build and Push Docker Image

on:
  push:
    branches:
      - deploy
    paths:
      - sortsys-api-v2/**
      - sortsys-v2-job_runner/**
      - scripts/test-api
      - .github/workflows/api-docker-build-and-publish.yml

jobs:
  test:
    name: Run full API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run full API integration suite
        shell: bash
        run: |
          unset TEST_RUN_SUFFIX
          unset TEST_NETWORK TEST_PG_CONTAINER TEST_S3_CONTAINER TEST_API_CONTAINER
          unset TEST_JOB_RUNNER_1_CONTAINER TEST_JOB_RUNNER_2_CONTAINER
          unset TEST_API_PORT TEST_PG_PORT TEST_S3_PORT
          ./scripts/test-api --rerun-each=1

  build:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.result == 'success' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea OCI
        uses: docker/login-action@v3
        with:
          registry: gitea.lehnert.cloud
          username: ${{ vars.OCI_USERNAME }}
          password: ${{ secrets.OCI_ACCESS_TOKEN }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./sortsys-api-v2
          file: ./sortsys-api-v2/Dockerfile
          push: true
          tags: |
            ${{ vars.OCI_API_CONTAINER_NAME }}:latest
            ${{ vars.OCI_API_CONTAINER_NAME }}:${{ steps.vars.outputs.sha_short }}
