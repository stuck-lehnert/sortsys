services:
  duckdb:
    image: ${SORTSYS_STORE_IMAGE:-ghcr.io/stuck-lehnert/sortsys-store:latest}
    pull_policy: always
    command: ["/usr/local/bin/sortsys-duckdb"]
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    environment:
      DUCKDB_SERVICE_TOKEN: ${SERVICE_BASE64_64_DUCKDB}
      DUCKDB_DATA_DIRECTORY: /var/lib/sortsys-duckdb
    expose:
      - "9494"
      - "9495"
    volumes:
      - duckdb-data:/var/lib/sortsys-duckdb
    healthcheck:
      test: ["CMD", "/usr/local/bin/sortsys-duckdb", "--health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 1m

  office:
    image: ${SORTSYS_OFFICE_IMAGE:-ghcr.io/stuck-lehnert/sortsys-office:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    environment:
      OFFICE_PUBLIC_ORIGIN: ${OFFICE_PUBLIC_ORIGIN}
      OFFICE_SANDBOX_ORIGIN: ${OFFICE_SANDBOX_ORIGIN}
      SORTSYS_PUBLIC_ORIGIN: ${SORTSYS_PUBLIC_ORIGIN}
    expose:
      - "8080"
    volumes:
      - private-office-data:/var/lib/sortsys-office
    stop_grace_period: 20s

  drawio:
    image: ${DRAWIO_IMAGE:-jgraph/drawio:32.6.9}
    restart: unless-stopped
    environment:
      # The official image derives its Tomcat context path from this URL.
      # A relative same-origin URL keeps Coolify's generated domain authoritative.
      DRAWIO_SERVER_URL: ${DRAWIO_SERVER_URL:-/drawio/}
      DRAWIO_BASE_URL: ${DRAWIO_BASE_URL:-/drawio}
    expose:
      - "8080"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/drawio/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    stop_grace_period: 30s

  api:
    image: ${SORTSYS_API_IMAGE:-ghcr.io/stuck-lehnert/sortsys-api:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - data
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${SERVICE_BASE64_64_JWT}
      DUCKDB_QUACK_URI: quack:duckdb:9494
      DUCKDB_CONTROL_URL: http://duckdb:9495
      DUCKDB_SERVICE_TOKEN: ${SERVICE_BASE64_64_DUCKDB}
      DUCKDB_QUACK_DISABLE_SSL: "true"
      ADMIN_HASH: ${ADMIN_HASH:?Set ADMIN_HASH to a bcrypt hash for the global administrator}
      LLM_MCP_URL: ${LLM_MCP_URL:-}
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-}
      LLM_LIVE_INTERNAL_URL: ${LLM_LIVE_INTERNAL_URL:-}
      OFFICE_PUBLIC_ORIGIN: ${OFFICE_PUBLIC_ORIGIN}
      DRAWIO_PUBLIC_URL: /drawio
    expose:
      - "3000"
    depends_on:
      duckdb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:3000/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  webapp:
    image: ${SORTSYS_WEBAPP_IMAGE:-ghcr.io/stuck-lehnert/sortsys-webapp:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${WEBAPP_TMPFS_SIZE:-256m},mode=1777
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      SERVICE_URL_WEBAPP_80: /
      API_UPSTREAM: http://api:3000
      DRAWIO_UPSTREAM: http://drawio:8080
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-64m}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  default:
  data:
    internal: true

volumes:
  private-office-data:
  duckdb-data:
