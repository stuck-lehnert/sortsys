[package]
name = "sortsys-zerotrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Client-held encryption keys, signed authorization proofs and timestamp evidence"
include = ["Cargo.toml", "Cargo.lock", "rust/**", "test/fixtures/**", "README.md", "API.md", "LICENSE"]

[lib]
path = "rust/lib.rs"

[[test]]
name = "portable"
path = "rust/tests/portable.rs"

[workspace]

[features]
default = []
typescript = ["dep:ts-rs"]

[dependencies]
base64 = "0.23"
ed25519-dalek = "2.2"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
ts-rs = { version = "12", optional = true }
