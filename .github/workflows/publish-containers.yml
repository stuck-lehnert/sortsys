name: Publish containers

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ${{ matrix.image }}
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./sortsys-api-v2
            file: ./sortsys-api-v2/Dockerfile
          - image: jobrunner
            context: ./sortsys-v2-job_runner
            file: ./sortsys-v2-job_runner/Dockerfile
          - image: webapp
            context: .
            file: ./sortsys-webapp-v2/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Select image tags
        id: tags
        run: echo "revision=${GITHUB_SHA:0:10}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: SORTSYS_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ steps.tags.outputs.revision }}
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:latest
