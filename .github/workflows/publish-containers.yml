name: Publish containers

on:
  push:
    branches:
      - deploy
  workflow_call:
    inputs:
      revision:
        description: Commit to build after a successful predeploy promotion
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REVISION: ${{ inputs.revision || github.sha }}

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            image: api
            context: ./sortsys-api-v2
            dockerfile: ./sortsys-api-v2/Dockerfile
          - name: job runner
            image: jobrunner
            context: ./sortsys-v2-job_runner
            dockerfile: ./sortsys-v2-job_runner/Dockerfile
          - name: webapp
            image: webapp
            context: .
            dockerfile: ./sortsys-webapp-v2/Dockerfile

    steps:
      - name: Check out deploy revision
        uses: actions/checkout@v6

        with:
          ref: ${{ env.REVISION }}
      - name: Set image tag
        id: version
        shell: bash
        run: echo "short_sha=${REVISION:0:10}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          tags: |
            ghcr.io/stuck-lehnert/sortsys-${{ matrix.image }}:${{ steps.version.outputs.short_sha }}
            ghcr.io/stuck-lehnert/sortsys-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
