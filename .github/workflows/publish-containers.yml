name: Publish checked containers

on:
  workflow_call:
    inputs:
      revision:
        description: Exact candidate revision that passed the caller's checks
        required: true
        type: string
      artifacts:
        description: Immutable artifact IDs produced by this CI run
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REVISION: ${{ inputs.revision }}
  CI_BUILD_PLATFORM: linux/amd64

jobs:
  publish:
    name: Publish checked ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, jobrunner, webapp]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ fromJSON(inputs.artifacts)[matrix.image] }}
          path: ${{ runner.temp }}/checked-image
      - name: Verify the artifact and current deploy ref
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          node ./scripts/ci-artifacts.mjs verify "$RUNNER_TEMP/checked-image" \
            "$REVISION" "runtime-$IMAGE" "$CI_BUILD_PLATFORM"
          git fetch --no-tags origin refs/heads/deploy:refs/remotes/origin/deploy
          test "$(git rev-parse --verify refs/remotes/origin/deploy^{commit})" = "$REVISION"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified OCI image without rebuilding
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          node ./scripts/ci-artifacts.mjs publish "$RUNNER_TEMP/checked-image" \
            "$REVISION" "runtime-$IMAGE" "$CI_BUILD_PLATFORM"
