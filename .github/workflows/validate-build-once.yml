name: Validate build-once artifacts

on:
  push:
    branches: ["ci/validate-build-once-03723f86"]

permissions:
  contents: read

concurrency:
  group: validate-build-once-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_BUILD_PLATFORM: linux/amd64

jobs:
  build:
    name: Build candidate once
    uses: ./.github/workflows/build-candidate.yml
    with:
      revision: ${{ github.sha }}

  test:
    name: Test repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ fromJSON(needs.build.outputs.artifacts).tests }}
          path: ${{ runner.temp }}/candidate-tests
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ fromJSON(needs.build.outputs.artifacts).jobrunner }}
          path: ${{ runner.temp }}/candidate-jobrunner

      - name: Load the exact checked candidate images
        env:
          REVISION: ${{ github.sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          node ./scripts/ci-artifacts.mjs load "$RUNNER_TEMP/candidate-tests" \
            "$REVISION" tests "$CI_BUILD_PLATFORM"
          node ./scripts/ci-artifacts.mjs load "$RUNNER_TEMP/candidate-jobrunner" \
            "$REVISION" runtime-jobrunner "$CI_BUILD_PLATFORM"

      - name: Run all compiled API tests against a fresh instance
        env:
          CONTAINER_RUNTIME: docker
          TEST_PREBUILT_REVISION: ${{ github.sha }}
          TEST_API_START_TIMEOUT: 300
        run: ./scripts/test-api --rerun-each=1

  deploy-build:
    name: Build pinned deploy seed once
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/validate-build-once-03723f86'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy_sha: ${{ steps.deploy.outputs.sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pin the current deploy revision
        id: deploy
        run: |
          git fetch --no-tags origin refs/heads/deploy:refs/remotes/origin/deploy
          deploy_sha="$(git rev-parse --verify refs/remotes/origin/deploy^{commit})"
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/deploy-source" "$RUNNER_TEMP/deploy-build"
          git archive "$deploy_sha" sortsys-api-v2 \
            | tar -xf - -C "$RUNNER_TEMP/deploy-source"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/cache@v5
        with:
          path: |
            /tmp/sortsys-ci-cargo-home
            /tmp/sortsys-ci-api-target-deploy/${{ steps.deploy.outputs.sha }}
          key: deploy-${{ runner.os }}-rust-1.99-${{ steps.deploy.outputs.sha }}
          restore-keys: deploy-${{ runner.os }}-rust-1.99-
      - uses: docker/setup-buildx-action@v4
      - name: Prepare the cached API compiler SDK
        uses: docker/build-push-action@v7
        with:
          context: ./sortsys-api-v2
          file: ./sortsys-api-v2/rust-api/Dockerfile.test
          load: true
          tags: localhost/sortsys-ci-api-sdk:rust-1.99-pg17
          cache-from: type=gha,scope=api-ci-sdk
          cache-to: type=gha,mode=max,scope=api-ci-sdk
      - name: Compile only the original deploy seeder
        env:
          DEPLOY_SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          bash ./scripts/build-api-artifacts deploy \
            "$RUNNER_TEMP/deploy-source/sortsys-api-v2" \
            "$RUNNER_TEMP/deploy-build" "$DEPLOY_SHA"
          node ./scripts/ci-artifacts.mjs seal "$RUNNER_TEMP/deploy-build" \
            "$DEPLOY_SHA" deploy "$CI_BUILD_PLATFORM"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: deploy-${{ steps.deploy.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-build
          if-no-files-found: error
          retention-days: 7

  upgrade:
    name: Upgrade populated deploy databases
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/validate-build-once-03723f86'
    needs: [build, deploy-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ fromJSON(needs.build.outputs.artifacts).tests }}
          path: ${{ runner.temp }}/candidate-tests
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ fromJSON(needs.build.outputs.artifacts).jobrunner }}
          path: ${{ runner.temp }}/candidate-jobrunner
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.deploy-build.outputs.artifact_id }}
          path: ${{ runner.temp }}/deploy-build
      - name: Load the same candidate images used by the fresh-instance tests
        env:
          REVISION: ${{ github.sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          node ./scripts/ci-artifacts.mjs load "$RUNNER_TEMP/candidate-tests" \
            "$REVISION" tests "$CI_BUILD_PLATFORM"
          node ./scripts/ci-artifacts.mjs load "$RUNNER_TEMP/candidate-jobrunner" \
            "$REVISION" runtime-jobrunner "$CI_BUILD_PLATFORM"
      - name: Migrate populated deploy instance and run candidate tests
        env:
          CONTAINER_RUNTIME: docker
          DEPLOY_SHA: ${{ needs.deploy-build.outputs.deploy_sha }}
          TEST_PREBUILT_REVISION: ${{ github.sha }}
          TEST_BASELINE_BUILD_DIR: ${{ runner.temp }}/deploy-build
          TEST_API_START_TIMEOUT: 300
        run: ./scripts/test-deploy-upgrade "$DEPLOY_SHA" --rerun-each=1

  containers:
    name: Check ${{ matrix.image }} runtime image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, jobrunner, webapp]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          artifact-ids: ${{ fromJSON(needs.build.outputs.artifacts)[matrix.image] }}
          path: ${{ runner.temp }}/runtime-image
      - name: Load the already built production image
        env:
          REVISION: ${{ github.sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          node ./scripts/ci-artifacts.mjs load "$RUNNER_TEMP/runtime-image" \
            "$REVISION" "runtime-$IMAGE" "$CI_BUILD_PLATFORM"
      - name: Verify non-root, read-only and temporary-file compatibility
        env:
          REVISION: ${{ github.sha }}
          IMAGE: ${{ matrix.image }}
          JOBRUNNER_RUNTIME_TEST: ${{ runner.temp }}/runtime-image/ocr-runtime.test
        run: |
          ./scripts/test-container-runtime "$IMAGE" \
            "localhost/sortsys-ci-$IMAGE:$REVISION"
