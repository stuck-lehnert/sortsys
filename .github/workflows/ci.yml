name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Check for an existing CI success
        id: previous
        if: github.ref == 'refs/heads/predeploy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/reuse-ci-success
      - uses: dtolnay/rust-toolchain@stable
        if: steps.previous.outputs.reused != 'true'
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - uses: actions/setup-go@v7
        if: steps.previous.outputs.reused != 'true'
        with:
          go-version: "1.27"
          cache: false
      - uses: actions/setup-node@v7
        if: steps.previous.outputs.reused != 'true'
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        if: steps.previous.outputs.reused != 'true'
        with:
          bun-version: 1.4.4
      - name: Run tests and checks
        if: steps.previous.outputs.reused != 'true'
        env:
          CONTAINER_RUNTIME: docker
          TEST_API_START_TIMEOUT: 600
        run: ./scripts/ci

  promote:
    name: Forward tested predeploy to deploy
    if: github.ref == 'refs/heads/predeploy'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward deploy and start its container build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/promote-predeploy "$GITHUB_SHA"
          # A push using GITHUB_TOKEN does not trigger another push workflow.
          gh workflow run publish-containers.yml --ref deploy
