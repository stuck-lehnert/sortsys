name: CI

on:
  push:
    branches:
      - master
      - predeploy
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust 1.99
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust builds
        uses: actions/cache@v6
        with:
          path: |
            /tmp/sortsys-api-v2-cargo-registry
            /tmp/sortsys-api-v2-rust-target
            sortsys-dwgviewer/lib/target
          key: rust-1.99-${{ runner.os }}-${{ hashFiles('sortsys-api-v2/Cargo.lock', 'sortsys-dwgviewer/lib/Cargo.lock') }}
          restore-keys: |
            rust-1.99-${{ runner.os }}-

      - name: Set up Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: sortsys-v2-job_runner/go.sum

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: sortsys-dwgviewer/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Run all checks
        env:
          CONTAINER_RUNTIME: docker
        run: ./scripts/ci

  containers:
    name: Check ${{ matrix.image }} runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./sortsys-api-v2
            dockerfile: ./sortsys-api-v2/Dockerfile
          - image: jobrunner
            context: ./sortsys-v2-job_runner
            dockerfile: ./sortsys-v2-job_runner/Dockerfile
          - image: webapp
            context: .
            dockerfile: ./sortsys-webapp-v2/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate both Compose configurations
        run: |
          docker compose --env-file .compose-env.example -f compose.yaml config --quiet
          docker compose --env-file .compose-env.example -f ghcr-compose.yaml config --quiet

      - name: Verify build-context secret and artifact exclusions
        if: matrix.image == 'api'
        run: ./scripts/test-container-contexts

      - name: Build the production runtime image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: SORTSYS_REVISION=${{ github.sha }}
          pull: true
          push: false
          load: true
          tags: sortsys-container-test:${{ matrix.image }}
          cache-from: type=gha,scope=check-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=check-${{ matrix.image }}

      - name: Export worker runtime tests without shipping them in the image
        if: matrix.image == 'jobrunner'
        uses: docker/build-push-action@v7
        with:
          context: ./sortsys-v2-job_runner
          file: ./sortsys-v2-job_runner/Dockerfile
          target: runtime-test-binary
          pull: true
          push: false
          outputs: type=local,dest=${{ runner.temp }}/sortsys-jobrunner-tests
          cache-from: type=gha,scope=check-jobrunner

      - name: Exercise the hardened runtime and required tools
        env:
          JOBRUNNER_RUNTIME_TEST:
            ${{ runner.temp }}/sortsys-jobrunner-tests/ocr-runtime.test
        run: |
          ./scripts/test-container-runtime '${{ matrix.image }}' \
            'sortsys-container-test:${{ matrix.image }}'

  upgrade:
    name: Upgrade populated deploy databases
    if: github.ref == 'refs/heads/predeploy'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      deploy_sha: ${{ steps.deploy.outputs.sha }}

    steps:
      - name: Check out candidate revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin the current deploy revision
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/deploy:refs/remotes/origin/deploy
          echo "sha=$(git rev-parse --verify refs/remotes/origin/deploy)" >> "$GITHUB_OUTPUT"

      - name: Cache upgrade builds
        uses: actions/cache@v6
        with:
          path: |
            /tmp/sortsys-api-v2-cargo-registry
            /tmp/sortsys-api-v2-rust-target
            /tmp/sortsys-api-v2-rust-target-deploy
          key: upgrade-rust-1.99-${{ runner.os }}-${{ hashFiles('sortsys-api-v2/Cargo.lock') }}
          restore-keys: |
            upgrade-rust-1.99-${{ runner.os }}-
            rust-1.99-${{ runner.os }}-

      - name: Migrate populated deploy instance and run candidate tests
        env:
          CONTAINER_RUNTIME: docker
          DEPLOY_BASE_SHA: ${{ steps.deploy.outputs.sha }}
        run: ./scripts/test-deploy-upgrade "$DEPLOY_BASE_SHA"

  promote:
    name: Promote predeploy to deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/predeploy'
    needs: [test, upgrade, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward deploy from the tested baseline
        shell: bash
        env:
          DEPLOY_BASE_SHA: ${{ needs.upgrade.outputs.deploy_sha }}
        run: ./scripts/promote-predeploy "$GITHUB_SHA" "$DEPLOY_BASE_SHA"

  publish:
    name: Publish promoted containers
    if: github.event_name == 'push' && github.ref == 'refs/heads/predeploy'
    needs: promote
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-containers.yml
    with:
      revision: ${{ github.sha }}
