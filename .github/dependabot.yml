version: 2

updates:
  # Production containers use npm; keep its lockfiles maintained alongside Bun.
  - package-ecosystem: npm
    directories:
      - /sortsys-webapp-v2
      - /sortsys-dwgviewer
      - /sortsys-react-components
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react-router:
        patterns: ["react-router", "@react-router/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directories:
      - /sortsys-api-v2/client
      - /sortsys-webapp-v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react-router:
        patterns: ["react-router", "@react-router/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The API's root Cargo.lock covers the rust-api workspace member.
  - package-ecosystem: cargo
    directories:
      - /sortsys-api-v2
      - /sortsys-dwgviewer/lib
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    open-pull-requests-limit: 10
    groups:
      rustcrypto:
        patterns: ["aes-gcm", "hmac", "p256", "sha2"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /sortsys-v2-job_runner
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    open-pull-requests-limit: 10

  # Includes Dockerfile.test, ARG-based images, and images used by shell scripts.
  - package-ecosystem: docker
    directories:
      - /sortsys-api-v2
      - /sortsys-api-v2/rust-api
      - /sortsys-webapp-v2
      - /sortsys-v2-job_runner
      - /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep image updates for each compiler/runtime together across Dockerfiles.
    groups:
      node-runtime:
        patterns: ["*node"]
      rust-toolchain:
        patterns: ["*rust"]
      go-toolchain:
        patterns: ["*golang"]
      bun-runtime:
        patterns: ["*bun"]
      postgres:
        patterns: ["*postgres"]
    # Keep supported PostgreSQL 17 until the documented data migration is tested.
    # Node 25 is non-LTS/EOL. ONLYOFFICE 9.4.0 has the known regression.
    ignore:
      - dependency-name: "*postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*node"
        versions: ["25"]
      - dependency-name: onlyoffice/documentserver
        versions: ["9.4.0", "9.4.0.1"]

  # Both compose.yaml and ghcr-compose.yaml live in the repository root.
  # Locally built images and :latest tags have no version tag to update.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: onlyoffice/documentserver
        versions: ["9.4.0", "9.4.0.1"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
        # Compiler versions must not change inside an unrelated Actions group.
        exclude-patterns: ["dtolnay/rust-toolchain"]
