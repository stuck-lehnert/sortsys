[package]
name = "sortsys-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"

[dependencies]
aes-gcm = "0.11"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.23"
bcrypt = "0.19"
ciborium = "0.2"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
email_address = "0.2"
ed25519-dalek = "2.2"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
percent-encoding = "2"
opaque-ke = { version = "4.0", features = ["argon2"] }
argon2 = "0.5"
p256 = { version = "0.14", features = ["ecdsa"] }
regex = "1"
roxmltree = "0.21.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha2_10 = { package = "sha2", version = "0.10" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["compression-full", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl"] }
url = "2"
yrs = { version = "0.28", features = ["sync"] }
duckdb = { version = "~1.20000.1", default-features = false }

[dev-dependencies]
tokio-tungstenite = "0.30"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
